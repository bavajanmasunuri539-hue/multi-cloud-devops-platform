services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi-cloud-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - multi-cloud-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi-cloud-backend
    ports:
      - "8083:5000"
    depends_on:
      - api
    networks:
      - multi-cloud-network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: multi-cloud-api
    ports:
      - "8082:8080"
    networks:
      - multi-cloud-network

  prometheus:
    image: prom/prometheus:latest
    container_name: multi-cloud-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - multi-cloud-network

  grafana:
    image: grafana/grafana:latest
    container_name: multi-cloud-grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - multi-cloud-network

networks:
  multi-cloud-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
