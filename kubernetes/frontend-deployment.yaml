apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: multi-cloud
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: multi-cloud-devops-platform-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80