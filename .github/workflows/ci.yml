name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}

jobs:

  # ============================================================
  # FRONTEND
  # ============================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        continue-on-error: true

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND
  # ============================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No tests directory found"
          fi
        continue-on-error: true


  # ============================================================
  # GO API
  # ============================================================
  api:
    name: Go API CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api/src

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download Go dependencies
        run: go mod download

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go tests
        run: go test ./...

      - name: Build Go API
        run: go build ./...


  # ============================================================
  # SONARQUBE
  # ============================================================
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - api

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # DOCKER BUILD + NEXUS PUSH
  # ============================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - frontend
      - backend
      - api
      - sonar

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Create image tag
      # --------------------------------------------------------
      - name: Set Docker image tag
        id: tag
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Login to Nexus
      # --------------------------------------------------------
      - name: Login to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      # --------------------------------------------------------
      # Build Frontend
      # --------------------------------------------------------
      - name: Build Frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/frontend:${{ steps.tag.outputs.tag }} \
            ./frontend

      # --------------------------------------------------------
      # Build Backend
      # --------------------------------------------------------
      - name: Build Backend Docker image
        run: |
          docker build \
            -t ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/backend:${{ steps.tag.outputs.tag }} \
            ./backend

      # --------------------------------------------------------
      # Build Go API
      # --------------------------------------------------------
      - name: Build API Docker image
        run: |
          docker build \
            -t ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/api:${{ steps.tag.outputs.tag }} \
            ./api

      # --------------------------------------------------------
      # Push Frontend
      # --------------------------------------------------------
      - name: Push Frontend image
        run: |
          docker push \
            ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/frontend:${{ steps.tag.outputs.tag }}

      # --------------------------------------------------------
      # Push Backend
      # --------------------------------------------------------
      - name: Push Backend image
        run: |
          docker push \
            ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/backend:${{ steps.tag.outputs.tag }}

      # --------------------------------------------------------
      # Push API
      # --------------------------------------------------------
      - name: Push API image
        run: |
          docker push \
            ${{ secrets.NEXUS_REGISTRY }}/multi-cloud/api:${{ steps.tag.outputs.tag }}

      # --------------------------------------------------------
      # Display pushed images
      # --------------------------------------------------------
      - name: Display image information
        run: |
          echo "Frontend:"
          echo "${{ secrets.NEXUS_REGISTRY }}/multi-cloud/frontend:${{ steps.tag.outputs.tag }}"

          echo "Backend:"
          echo "${{ secrets.NEXUS_REGISTRY }}/multi-cloud/backend:${{ steps.tag.outputs.tag }}"

          echo "API:"
          echo "${{ secrets.NEXUS_REGISTRY }}/multi-cloud/api:${{ steps.tag.outputs.tag }}"