name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 114403655423.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: .
          args: >-
            -Dsonar.projectKey=multi-cloud-devops-platform
            -Dsonar.projectName=multi-cloud-devops-platform
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    needs: sonar

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push API
        run: |
          docker build \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/api:${{ github.sha }} \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/api:latest \
            ./api

          docker push $ECR_REGISTRY/multi-cloud-devops-platform/api:${{ github.sha }}
          docker push $ECR_REGISTRY/multi-cloud-devops-platform/api:latest

      - name: Build and Push Backend
        run: |
          docker build \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/backend:${{ github.sha }} \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/backend:latest \
            ./backend

          docker push $ECR_REGISTRY/multi-cloud-devops-platform/backend:${{ github.sha }}
          docker push $ECR_REGISTRY/multi-cloud-devops-platform/backend:latest

      - name: Build and Push Frontend
        run: |
          docker build \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/frontend:${{ github.sha }} \
            -t $ECR_REGISTRY/multi-cloud-devops-platform/frontend:latest \
            ./frontend

          docker push $ECR_REGISTRY/multi-cloud-devops-platform/frontend:${{ github.sha }}
          docker push $ECR_REGISTRY/multi-cloud-devops-platform/frontend:latest

