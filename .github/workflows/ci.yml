name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 114403655423.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false
        continue-on-error: true
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt
      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest
          elif [ -d src/tests ]; then
            pytest src/tests
          else
            echo "No tests directory found"
          fi
        continue-on-error: true

  api:
    name: Go API CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Download dependencies
        run: go mod download
      - name: Verify dependencies
        run: go mod verify
      - name: Run tests
        run: go test ./...
      - name: Build API
        run: go build ./...

  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build and Push Images to ECR
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
      - api
      - sonar
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set image tag
        id: tag
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build frontend image
        run: docker build -t "$ECR_REGISTRY/multi-cloud-devops-platform/frontend:${{ steps.tag.outputs.tag }}" ./frontend
      - name: Build backend image
        run: docker build -t "$ECR_REGISTRY/multi-cloud-devops-platform/backend:${{ steps.tag.outputs.tag }}" ./backend
      - name: Build API image
        run: docker build -t "$ECR_REGISTRY/multi-cloud-devops-platform/api:${{ steps.tag.outputs.tag }}" ./api
      - name: Push frontend image
        run: docker push "$ECR_REGISTRY/multi-cloud-devops-platform/frontend:${{ steps.tag.outputs.tag }}"
      - name: Push backend image
        run: docker push "$ECR_REGISTRY/multi-cloud-devops-platform/backend:${{ steps.tag.outputs.tag }}"
      - name: Push API image
        run: docker push "$ECR_REGISTRY/multi-cloud-devops-platform/api:${{ steps.tag.outputs.tag }}"
      - name: Show pushed images
        run: |
          echo "Frontend: $ECR_REGISTRY/multi-cloud-devops-platform/frontend:${{ steps.tag.outputs.tag }}"
          echo "Backend:  $ECR_REGISTRY/multi-cloud-devops-platform/backend:${{ steps.tag.outputs.tag }}"
          echo "API:      $ECR_REGISTRY/multi-cloud-devops-platform/api:${{ steps.tag.outputs.tag }}"
