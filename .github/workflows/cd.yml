name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 114403655423.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  deploy:
    name: Deploy to Kubernetes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name multi-cloud-devops-platform-prod-eks

      - name: Deploy API
        run: |
          kubectl rollout restart deployment/api-api -n multi-cloud
          kubectl rollout status deployment/api-api -n multi-cloud --timeout=180s

      - name: Deploy Backend
        run: |
          kubectl rollout restart deployment/backend-backend -n multi-cloud
          kubectl rollout status deployment/backend-backend -n multi-cloud --timeout=180s

      - name: Deploy Frontend
        run: |
          kubectl rollout restart deployment/frontend-frontend -n multi-cloud
          kubectl rollout status deployment/frontend-frontend -n multi-cloud --timeout=180s

      - name: Verify deployment
        run: |
          echo "=== PODS ==="
          kubectl get pods -n multi-cloud

          echo "=== SERVICES ==="
          kubectl get svc -n multi-cloud

          echo "=== DEPLOYMENTS ==="
          kubectl get deployments -n multi-cloud
