name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  NAMESPACE: multi-cloud

jobs:
  deploy:
    name: Deploy to Kubernetes
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Kubernetes
        run: |
          kubectl version --client
          kubectl get nodes

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Helm version
        run: helm version

      - name: Lint API chart
        run: |
          helm lint ./helm/api

      - name: Lint Backend chart
        run: |
          helm lint ./helm/backend

      - name: Lint Frontend chart
        run: |
          helm lint ./helm/frontend

      - name: Set image tag
        id: tag
        run: |
          echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Deploy API
        run: |
          helm upgrade --install api ./helm/api \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag=${{ steps.tag.outputs.tag }}

      - name: Deploy Backend
        run: |
          helm upgrade --install backend ./helm/backend \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag=${{ steps.tag.outputs.tag }}

      - name: Deploy Frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag=${{ steps.tag.outputs.tag }}

      - name: Wait for API
        run: |
          kubectl rollout status \
            deployment/api-api \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Wait for Backend
        run: |
          kubectl rollout status \
            deployment/backend-backend \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Wait for Frontend
        run: |
          kubectl rollout status \
            deployment/frontend-frontend \
            -n ${{ env.NAMESPACE }} \
            --timeout=180s

      - name: Show pods
        run: |
          kubectl get pods \
            -n ${{ env.NAMESPACE }} \
            -o wide

      - name: Show services
        run: |
          kubectl get services \
            -n ${{ env.NAMESPACE }}