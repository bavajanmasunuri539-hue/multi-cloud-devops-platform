name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - frontend
          - backend
          - nginx

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/multi-cloud-${{ matrix.service }}:latest \
            ./docker/${{ matrix.service }}

      - name: Push image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/multi-cloud-${{ matrix.service }}:latest

  deploy:
    name: Deploy Kubernetes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Update image names
        run: |
          sed -i \
            "s|DOCKER_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" \
            kubernetes/frontend-deployment.yaml

          sed -i \
            "s|DOCKER_USERNAME|${{ secrets.DOCKER_USERNAME }}|g" \
            kubernetes/backend-deployment.yaml

      - name: Deploy namespace
        run: kubectl apply -f kubernetes/namespace.yaml

      - name: Deploy ConfigMap
        run: kubectl apply -f kubernetes/configmap.yaml

      - name: Deploy frontend
        run: kubectl apply -f kubernetes/frontend-deployment.yaml

      - name: Deploy frontend service
        run: kubectl apply -f kubernetes/frontend-service.yaml

      - name: Deploy backend
        run: kubectl apply -f kubernetes/backend-deployment.yaml

      - name: Deploy backend service
        run: kubectl apply -f kubernetes/backend-service.yaml

      - name: Deploy ingress
        run: kubectl apply -f kubernetes/ingress.yaml

      - name: Check deployment
        run: |
          kubectl get pods -n multi-cloud
          kubectl get svc -n multi-cloud